<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strong Years Funnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&display=swap">
<style>
/* Layout: phone-first single screen column; on wide screens a flow rail sits beside a phone-width device frame. */
:root{
  --paper:#FBF6EC;        /* warm cream page */
  --surface:#FFFFFF;      /* rice cards */
  --ink:#16120E;          /* every piece of text */
  --line:#16120E;         /* borders */
  --jade:#1F5A46;         /* secondary buttons, selected answers, chart line */
  --on-jade:#FFFFFF;
  --jade-wash:#E4EFE8;    /* selected plan background */
  --persimmon:#B3311C;    /* primary buttons */
  --on-persimmon:#FFFFFF;
  --persimmon-text:#B3311C;
  --brass:#E7B85A;        /* highlight bars, labels (text on it is always ink) */
  --on-brass:#16120E;
  --strip:#16120E;        /* disclosure strip */
  --on-strip:#FBF6EC;
  --link:#1F5A46;
  --bubble-in:#FFFFFF;
  --bubble-out:#1F5A46;
  --on-bubble-out:#FFFFFF;
  --focus:#16120E;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1713; --surface:#18231D; --ink:#F6EFE2; --line:#CFE0D6;
    --jade:#256B52; --on-jade:#FFFFFF; --jade-wash:#1F3329;
    --persimmon:#B3311C; --on-persimmon:#FFFFFF; --persimmon-text:#FF9A7E;
    --brass:#E7B85A; --on-brass:#16120E; --strip:#1F5A46; --on-strip:#FFFFFF;
    --link:#8ED3B5; --bubble-in:#22302A; --bubble-out:#256B52; --on-bubble-out:#FFFFFF; --focus:#F6EFE2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1713; --surface:#18231D; --ink:#F6EFE2; --line:#CFE0D6;
  --jade:#256B52; --on-jade:#FFFFFF; --jade-wash:#1F3329;
  --persimmon:#B3311C; --on-persimmon:#FFFFFF; --persimmon-text:#FF9A7E;
  --brass:#E7B85A; --on-brass:#16120E; --strip:#1F5A46; --on-strip:#FFFFFF;
  --link:#8ED3B5; --bubble-in:#22302A; --bubble-out:#256B52; --on-bubble-out:#FFFFFF; --focus:#F6EFE2;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 20px/1.55 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0;font-variation-settings:"opsz" 72}
h1{font-size:2.05rem}
h2{font-size:1.6rem}
h3{font-size:1.3rem}
p{margin:0}
a{color:var(--link);text-underline-offset:3px;text-decoration-thickness:2px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.small{font-size:17px;line-height:1.5}
input[type=checkbox],input[type=radio]{-webkit-appearance:none;appearance:none;flex:none;margin:0;width:30px;height:30px;border:2px solid var(--line);background:var(--surface);border-radius:7px;display:inline-grid;place-content:center;cursor:pointer}
input[type=radio]{border-radius:50%}
input[type=checkbox]:checked{background:var(--jade)}
input[type=checkbox]:checked::after{content:"";width:8px;height:15px;border:solid var(--on-jade);border-width:0 4px 4px 0;transform:translateY(-2px) rotate(45deg)}
input[type=radio]:checked{background:var(--jade);box-shadow:inset 0 0 0 5px var(--surface)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:18px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row > svg,.row > figure{flex:none}

/* App frame */
.app{display:grid;grid-template-columns:minmax(0,1fr)}
.rail{display:none}
.device{min-width:0;background:var(--paper)}
@media (min-width:960px){
  body{padding-inline:24px}
  .app{grid-template-columns:290px minmax(0,470px);justify-content:center;gap:56px;padding-block:36px}
  .rail{display:block;position:sticky;top:calc(24px + env(safe-area-inset-top,0px));align-self:start}
  .device{border:2px solid var(--line);border-radius:30px;overflow:hidden}
  .jump{display:none}
}
.rail h2{font-size:1.5rem;margin-bottom:6px}
.rail p{font-size:17px;margin-bottom:18px}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rail button{width:100%;text-align:left;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid transparent;background:transparent;cursor:pointer;display:flex;gap:12px;align-items:baseline;font-size:18px}
.rail button .n{font-family:var(--display);font-weight:700;min-width:1.2em}
.rail button:hover{border-color:var(--line)}
.rail button[aria-current="step"]{background:var(--jade);color:var(--on-jade);border-color:var(--jade)}

/* Disclosure strip */
.strip{background:var(--strip);color:var(--on-strip);font-size:17px;line-height:1.45;padding:12px 18px}
.strip a{color:var(--on-strip);display:inline-flex;align-items:center;min-height:44px;font-weight:700}
.wrap{padding-inline:18px;padding-block:24px 32px}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:2px solid var(--line)}
.wordmark{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
.wordmark i{font-style:italic;font-weight:500;color:var(--persimmon-text)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;min-height:60px;padding:12px 20px;border-radius:var(--r);border:2px solid var(--persimmon);background:var(--persimmon);color:var(--on-persimmon);font-weight:700;font-size:20px;line-height:1.25;cursor:pointer;text-decoration:none}
.btn.jade{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn.outline{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.inline{width:auto}
.btn:active{transform:translateY(1px)}
.textbtn{background:none;border:0;padding:10px 0;min-height:48px;color:var(--link);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px;cursor:pointer;font-weight:700;text-align:left}
.micro{font-size:17px;line-height:1.5}

/* Answer options */
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:14px 16px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;cursor:pointer;line-height:1.35}
.opt .box{flex:none;width:28px;height:28px;border:2px solid currentColor;border-radius:6px;display:grid;place-items:center;font-weight:700}
.opt .dot{flex:none;width:26px;height:26px;border:2px solid currentColor;border-radius:50%}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.opt[aria-pressed="true"] .dot{box-shadow:inset 0 0 0 5px var(--jade);background:var(--on-jade)}
.opt[aria-checked="true"] .box::after{content:"✓"}

.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qcount{font-weight:700}
.meter{height:12px;border:2px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden}
.meter span{display:block;height:100%;background:var(--jade)}

/* Cards by role */
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:20px}
.alert{background:var(--brass);color:var(--on-brass);border-radius:12px;padding:12px 14px;font-weight:700}
.alert a,.alert button{color:var(--on-brass)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--brass);color:var(--on-brass);font-size:16px;font-weight:700;line-height:1.2;padding:4px 10px;border-radius:999px;white-space:nowrap}
.checklist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.checklist li{display:flex;gap:12px;align-items:flex-start}
.checklist li::before{content:"";flex:none;width:14px;height:14px;margin-top:.45em;background:var(--persimmon)}
.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;border-top:2px solid var(--line)}
.days li{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}
.days b{font-family:var(--display)}

/* Characters */
.char{display:flex;gap:14px;align-items:center}
.char figure{margin:0;flex:none;position:relative}
.char svg{display:block;border-radius:18px}
.char .pill{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%)}

/* DM mock */
.dm-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:2px solid var(--line);background:var(--surface)}
.dm-head .who{min-width:0}
.dm-head .who b{display:block;font-size:18px;overflow-wrap:anywhere}
.dm-body{padding:18px 14px 28px;display:flex;flex-direction:column;gap:12px}
.ctx{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;background:var(--surface)}
.ctx p{font-size:17px}
.sep{text-align:center;font-size:16px;font-weight:700;padding:4px 0}
.msg{max-width:88%;padding:12px 14px;border-radius:18px;line-height:1.45;font-size:19px}
.msg.in{align-self:flex-start;background:var(--bubble-in);border:2px solid var(--line);border-bottom-left-radius:6px}
.msg.out{align-self:flex-end;background:var(--bubble-out);color:var(--on-bubble-out);border-bottom-right-radius:6px}
.msg p+p{margin-top:10px}
.msg .linkcard{display:block;margin-top:10px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;overflow-wrap:anywhere}
.qr{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:100%}
.qr button{min-height:52px;padding:8px 18px;border-radius:999px;border:2px solid var(--jade);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer}
.qr button.primary{background:var(--jade);color:var(--on-jade)}
.typing{align-self:flex-start;font-size:17px;font-weight:700}

/* Quiz */
.timer{font-family:var(--display);font-weight:700;font-size:5.5rem;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.timerbox{border:3px solid var(--line);border-radius:22px;padding:20px 16px;background:var(--surface);display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.stepper{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:10px;align-items:center}
.stepper button{height:64px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);font-size:30px;font-weight:700;cursor:pointer}
.stepper input{height:64px;width:100%;text-align:center;font-family:var(--display);font-size:2.2rem;font-weight:700;border:2px solid var(--line);border-radius:var(--r);background:var(--surface)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field input{min-height:56px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:20px}
.tick{display:flex;gap:14px;align-items:flex-start;cursor:pointer;line-height:1.45}
.tick input{margin-top:2px}
.stage{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-bottom:2px solid var(--line)}
.stage .btn{min-height:56px;font-size:19px}
.feet{flex:none}

/* Result */
.sa{border:3px solid var(--jade);border-radius:22px;background:var(--surface);padding:20px}
.sa .big{font-family:var(--display);font-weight:700;font-size:4.6rem;line-height:1;color:var(--persimmon-text);display:inline-block;border-bottom:8px solid var(--brass);padding-bottom:2px}
.sa dl{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:16px 0 0}
.sa dl div{display:flex;justify-content:space-between;gap:12px;border-top:2px solid var(--line);padding-top:8px}
.sa dt{font-weight:700}
.sa dd{margin:0;text-align:right}

/* Offer */
.plan{display:flex;gap:14px;align-items:flex-start;border:2px solid var(--line);border-radius:18px;padding:18px;background:var(--surface);cursor:pointer}
.plan input{margin-top:2px}
.plan:has(input:checked){border:3px solid var(--jade);background:var(--jade-wash);padding:17px}
.plan .price{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.1}
.plan ul{margin:8px 0 0;padding-left:1.1em}
.terms{border:2px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);font-size:20px}
.terms p+p{margin-top:8px}
.placeholder{border:3px dashed var(--line);border-radius:18px;padding:18px}
details{border-top:2px solid var(--line);padding:6px 0}
summary{cursor:pointer;font-weight:700;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--display);font-size:1.6rem;line-height:1}
details[open] summary::after{content:"\2212"}
details p{padding-bottom:10px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.pair .char{flex-direction:column;align-items:flex-start}
.receipt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.receipt td{padding:8px 0;border-bottom:2px solid var(--line);vertical-align:top}
.receipt td:last-child{text-align:right;padding-left:12px;white-space:nowrap}
.receipt tr.total td{font-weight:700;border-bottom:0}

/* Welcome checklist */
.todo{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.todo label{display:flex;gap:14px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);cursor:pointer}
.todo input{width:32px;height:32px}
.todo label:has(input:checked){background:var(--jade-wash)}
.todo span b{display:block}

/* Dashboard */
.dash-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tracks{display:flex;gap:8px;flex-wrap:wrap}
.tracks button{min-height:48px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.tracks button[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.week div{border:2px solid var(--line);border-radius:10px;padding:6px 0;font-size:16px;font-weight:700}
.week div.done{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.week div.today{outline:3px solid var(--persimmon);outline-offset:1px}
.chat{display:flex;flex-direction:column;gap:10px}
.grade{display:inline-block;border:2px solid var(--line);border-radius:8px;padding:2px 8px;font-weight:700;font-size:16px}

/* Footer */
.foot{border-top:2px solid var(--line);padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.45}
.foot .note{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.foot .jump{flex:1 1 100%;min-width:0}
.foot select{width:100%;min-height:48px;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 10px;font-size:17px;max-width:100%}
.foot button{min-height:44px;background:none;border:0;color:var(--link);text-decoration:underline;cursor:pointer;padding:0;font-weight:700;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100% - 32px));background:var(--strip);color:var(--on-strip);border-radius:14px;padding:14px 16px;font-size:18px;z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (min-width:960px){h1{font-size:2.2rem}}
</style>

<div class="app">
  <aside class="rail" aria-label="Funnel steps">
    <h2>Strong Years funnel</h2>
    <p>Tap any step to jump. The phone on the right is what a member sees.</p>
    <ol id="rail"></ol>
  </aside>
  <div class="device">
    <main id="screen" tabindex="-1"></main>
    <footer class="foot">
      <div class="note"><span class="pill">Prototype, not live</span><span>No payment is taken and nothing you type is sent anywhere.</span></div>
      <div class="row">
        <label class="jump" for="jump"><span class="sr">Jump to a step</span>
          <select id="jump"></select>
        </label>
        <button type="button" data-act="restart">Start over</button>
      </div>
    </footer>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
const DOMAIN = "strongyears.com";
const FOUNDING = 25;    // founding membership monthly price (blitz test cell $25 vs $30)
const PRICE = FOUNDING; // the $1 trial renews at the founding test price (not $20)
const CAP = 5000;       // real founding cohort cap
const STEPS = [
  ["dm","Instagram DM"],["quiz","Strength Age quiz"],["result","Your result"],["offer","Offer"],
  ["checkout","Checkout"],["upsell","After-purchase offer"],["welcome","Welcome and first 72 hours"],["dash","Members home"]
];

/* ---------- state ---------- */
function fresh(){
  return {step:"dm", dm:[], a:{}, qcur:"intro", qstack:[], lead:{name:"",email:"",sms:false,phone:""},
    sample:false, plan:{arm:"founding",pack:"none"}, offerConsent:false,
    co:{name:"",email:"",phone:"",sms:false,bump:false,consent:false}, paid:null, upsell:"u1", orders:[],
    check:[false,false,false,false,false,false,false], track:null, swap:false, voice:true};
}
let S = fresh();
function save(){ try{ localStorage.setItem("sy-proto", JSON.stringify(S)); }catch(e){} }
function load(){ try{ const t = localStorage.getItem("sy-proto"); if(t){ const o = JSON.parse(t); if(o && o.step) S = Object.assign(fresh(), o); } }catch(e){} }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + (Math.round(n*100)/100).toFixed(n % 1 ? 2 : 0);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const today = new Date();
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const addMonths = (d,n) => new Date(d.getFullYear(), d.getMonth()+n, d.getDate());
const fmt = d => d.toLocaleDateString("en-US",{weekday:"long", month:"long", day:"numeric"});
const fmtShort = d => d.toLocaleDateString("en-US",{month:"long", day:"numeric"});
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{ t.hidden = true; }, 3800); }

/* ---------- character illustrations (placeholders, clearly labelled) ---------- */
function chang(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" role="img" aria-label="Illustrated placeholder of Chang Yin, an AI character">
    <rect width="120" height="120" rx="22" fill="#1F5A46"/>
    <path d="M8 120c2-26 16-38 34-41h36c18 3 32 15 34 41z" fill="#E9D8BE"/>
    <path d="M34 120V86c6-3 10-5 14-5l12 10 12-10c4 0 8 2 14 5v34z" fill="#1E2C44"/>
    <rect x="52" y="64" width="16" height="18" rx="6" fill="#E9D8BE"/>
    <circle cx="60" cy="46" r="21" fill="#E9D8BE"/>
    <path d="M39 42c0-14 9-20 21-20s21 6 21 20c-3-6-8-9-21-9s-18 3-21 9z" fill="#FBF6EC"/>
    <path d="M42 52c2 12 9 18 18 18s16-6 18-18c-3 4-6 5-10 5H52c-4 0-7-1-10-5z" fill="#FBF6EC"/>
    <text x="104" y="22" text-anchor="end" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="17" fill="#FBF6EC">CY</text>
  </svg>`;
}
function sun(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" role="img" aria-label="Illustrated placeholder of Sun Yoon, an AI character">
    <rect width="120" height="120" rx="22" fill="#B3311C"/>
    <path d="M12 120c2-24 15-36 32-39h32c17 3 30 15 32 39z" fill="#2E7A5F"/>
    <path d="M47 81l13 22 13-22z" fill="#FBF6EC"/>
    <rect x="53" y="62" width="14" height="18" rx="6" fill="#E9D8BE"/>
    <path d="M36 50c0-18 10-28 24-28s24 10 24 28v14c0 3-2 5-5 5h-3V46c-6-2-14-7-17-12-3 6-10 10-18 12v23h-1c-3 0-4-2-4-5z" fill="#F4EFE8"/>
    <ellipse cx="60" cy="50" rx="17" ry="20" fill="#E9D8BE"/>
    <path d="M42 42c4-10 10-14 18-14 9 0 15 5 18 14-7-1-14-5-18-10-4 6-11 9-18 10z" fill="#F4EFE8"/>
    <rect x="75" y="34" width="9" height="5" rx="2" fill="#6B3E1F" transform="rotate(-25 79 36)"/>

/* =========================================================
   SCORING (FUNNEL.md 3.1 scoring logic)
   ========================================================= */
// [age band start, women midpoint, men midpoint, STEADI cutoff W, STEADI cutoff M]
const NORMS = [[60,14.5,16.5,12,14],[65,13.5,15.0,11,12],[70,12.5,14.5,10,12],[75,12.5,14.0,10,11],[80,11.5,12.5,9,10],[85,10.5,11.0,8,8],[90,7.5,9.5,4,7]];
const W = { q6:[-1,0,2,3], q7:[-2,0,2,4], q8:[-3,0,3,5,2], q9:[-2,0,2,4], q10:[-2,0,2,4], q11:[-2,-1,0,1] };
const STAGE_NAME = ["","feet-together position","half-step position","heel-to-toe position","one-foot stand"];
const SAMPLE = {q1:0,q2:0,q3:68,q4:[5],q5:0,reps:12,hands:false,stage:3,q6:1,q7:1,q8:1,q9:1,q10:0,q11:2,q12:[0],q13:4,q14:1};
function norm(age, sex){
  const a = Math.max(60, Math.min(95, age));
  let row = NORMS[0]; NORMS.forEach(r=>{ if(a>=r[0]) row=r; });
  const band = row[0]===90 ? "90–94" : `${row[0]}–${row[0]+4}`;
  const mids = [row[1],row[2]], lows=[row[3],row[4]];
  let mid, low;
  if(sex===0){ mid=mids[0]; low=lows[0]; } else if(sex===1){ mid=mids[1]; low=lows[1]; } else { mid=(mids[0]+mids[1])/2; low=(lows[0]+lows[1])/2; }
  const high = 2*mid-low;
  const r1 = x => Math.round(x);
  return {band, mid, low:r1(low), high:r1(high), cutoff:low};
}
function compute(){
  let a = S.a;
  const complete = a.q3!=null && a.q4 && a.q6!=null && a.q14!=null;
  if(!complete){ a = Object.assign({}, SAMPLE, a); }
  const age = a.q3==null?68:a.q3, sex = a.q2==null?2:a.q2;
  const N = norm(age, sex);
  const sexWord = sex===0?"women":sex===1?"men":"adults";
  const sv = k => (W[k][a[k]==null?1:a[k]]||0);
  const Sself = 0.5*(sv("q6")+sv("q7")+sv("q8")+sv("q9")+sv("q10")+sv("q11"));
  const safety = (a.q4||[]).filter(i=>i!==5);
  const seated = a.q5===3 || a.q5===4;
  const aches = (a.q12||[]).filter(i=>i<=2);
  const F_joint = aches.length>0 && ((a.q9!=null && a.q9>=2) || a.q8===2 || a.q8===3);
  const R = {age, sex, sexWord, N, S:Sself, safety, seated, aches, F_joint, helper:a.q1, reps:a.reps, hands:!!a.hands, stage:a.stage, curls:a.curls, q13:a.q13, sample:!complete};
  if(safety.length || seated){
    R.mode="safe"; R.SA=null; R.profile="P6";
    const why = ["chest discomfort","dizziness","a recent fall","surgery or a hospital stay","your doctor's advice"];
    const rs = safety.map(i=>why[i]); if(a.q5===3) rs.push("using a walker"); if(a.q5===4) rs.push("using a wheelchair");
    R.reason = listJoin(rs);
    return R;
  }
  if(a.q1===2){
    R.mode="answers";
    R.SA = Math.max(40, Math.round(age + clamp(2*Sself,-10,10)));
    R.gap = R.SA-age;
    R.profile = F_joint ? "P4" : R.gap<=-5 ? "P1" : R.gap>=5 ? "P5" : "P2";
    return R;
  }
  R.mode="tests";
  const reps = a.reps==null?10:a.reps, stage = a.stage==null?3:a.stage;
  R.reps = reps; R.stage = stage;
  let C = clamp(-2.5*(reps-N.mid), -12, 12);
  if(a.hands) C = Math.max(C, 8);
  let B = [10,8,5,0,-3][stage];
  if(age>=80){ if(stage===3) B=-2; if(stage===4) B=-5; }
  let SA = Math.round(age + C + B + Sself);
  SA = Math.max(40, clamp(SA, age-15, age+20));
  R.C=C; R.B=B; R.SA=SA; R.gap=SA-age;
  if(reps<5 || stage===0){ R.profile="P6"; R.reason = reps<5 ? "standing up from the chair being hard today" : "balance being hard today"; }
  else if(stage<=2) R.profile="P3";
  else if(F_joint) R.profile="P4";
  else if(R.gap<=-5) R.profile="P1";
  else if(R.gap>=5) R.profile="P5";
  else R.profile="P2";
  return R;
}
function listJoin(arr){ if(!arr.length) return ""; if(arr.length===1) return arr[0]; return arr.slice(0,-1).join(", ")+" and "+arr[arr.length-1]; }

      <p>Strength Age: <b class="num">${R.SA!=null&&!R.sample?R.SA:"not tested yet"}</b> · Retest on ${fmtShort(new Date(today.getFullYear(), today.getMonth()+1, 1))}</p>
    </section>

    <section class="card stack" aria-labelledby="k-h">
      <h2 id="k-h" style="font-size:1.45rem">Sun Yoon's Kitchen</h2>
      ${charBlock("sun", 80, `<p><b>This Sunday:</b> “Grams, not vibes. Thirty grams of protein at breakfast. I checked.”</p>`)}
      <ul class="checklist">
        <li>Doenjang jjigae with tofu and zucchini (soft-food version included)</li>
        <li>Egg-and-tofu breakfast scramble, about 30g protein</li>
        <li>Miyeok-guk, her seaweed soup, with beef or mussels</li>
      </ul>
      <p><b>This week's remedy:</b> ginger tea for an upset stomach. <span class="grade">Some evidence</span></p>
      <button type="button" class="btn outline" data-act="groceries">Open the grocery list</button>
    </section>

    <section class="card stack-s" aria-labelledby="c-h">
      <div class="row" style="justify-content:space-between"><h2 id="c-h" style="font-size:1.45rem">Ask Chang Yin</h2><span class="pill">AI coach</span></div>
      <p class="small"><b>You're chatting with an AI.</b> Chang Yin is an AI character, not a doctor or physical therapist. For chest pain, a fall with injury or stroke signs, call 911.</p>
      <div class="chat">
        <div class="msg in"><p>I'm Chang Yin, an AI character. I'm not a doctor or physical therapist. I can change today's session for you, or explain why we do it. What do you need?</p></div>
        <div class="msg out">My knee is sore today. Should I skip?</div>
        <div class="msg in"><p>Don't skip. Swap. Today we do the sore-knee version: seated knee extensions, slow. Mild ache that settles by tomorrow is okay. Sharp pain or swelling, stop and call your doctor. Legs first, but safe first.</p></div>
      </div>
      <p class="small">Example conversation. Memory is opt-in, and you can see or delete what the coach remembers.</p>
      <button type="button" class="btn jade" data-act="chat">Ask Chang Yin a question</button>
      <button type="button" class="textbtn" data-act="human">Talk to a human coach instead</button>
    </section>

    <section class="stack-s"><h2 style="font-size:1.35rem">Wednesday Live Q&amp;A</h2><p>A real human coach from our team answers member questions live for 30 minutes. Introduced as a human, always.</p></section>
  </div>`;
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act;
  if(el.tagName==="A") e.preventDefault();
  switch(act){
    case "jump": go(el.dataset.step); break;
    case "restart": stopTimers(); S = fresh(); save(); go("dm"); break;
    case "dm": dmTap(el.dataset.k); break;
    case "qnext": qAdvance(); break;
    case "qback": qBack(); break;
    case "noop": break;
    case "qpick": {
      S.a[S.qcur] = +el.dataset.i; save();
      el.parentElement.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed", b===el ? "true":"false"));
      setTimeout(qAdvance, reduce?120:280); break;
    }
    case "qmulti": {
      const q = Q[S.qcur], i = +el.dataset.i; let sel = (S.a[S.qcur]||[]).slice();
      if(i===q.none) sel = sel.includes(i) ? [] : [i];
      else { sel = sel.filter(x=>x!==q.none); sel = sel.includes(i) ? sel.filter(x=>x!==i) : sel.concat(i); }
      S.a[S.qcur] = sel; save(); render(); break;
    }
    case "age": { const inp=$("#age"); inp.value = clamp((+inp.value||68)+ +el.dataset.d,45,95); $("#agenote").hidden = !(+inp.value<60); break; }
    case "agego": { S.a.q3 = clamp(Math.round(+$("#age").value||68),45,95); qAdvance(); break; }
    case "reps": case "curls": { const inp=$("#"+act); inp.value = clamp((+inp.value||0)+ +el.dataset.d,0,act==="reps"?30:40); break; }
    case "tstart": startChairTimer(); break;
    case "t1go": { S.a.reps = clamp(Math.round(+$("#reps").value||0),0,30); S.a.hands = $("#hands").checked; qAdvance(); break; }
    case "tarmgo": { S.a.curls = clamp(Math.round(+$("#curls").value||0),0,40); qAdvance(); break; }
    case "bstart": startBalance(+el.dataset.i); break;
    case "stage": {
      S.a.stage = +el.dataset.i; save();
      el.parentElement.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed", b===el ? "true":"false"));
      setTimeout(qAdvance, reduce?120:280); break;
    }
    case "toOffer": { S.plan.arm = el.dataset.arm||"trial"; S.plan.pack = el.dataset.pack||"none"; S.offerConsent=false; go("offer"); break; }
    case "gift": toast("The gift page (3 months $49, 12 months $119, never auto-renews) is a separate page, not built in this prototype."); break;
    case "savePlan": toast("Saved. In the live funnel we email the plan and the doctor summary, then a “Doctor said yes?” email in 3 days."); break;
    case "docpdf": toast("In the live funnel this downloads a one-page PDF: your answers, the chair-based plan, the stop rules and a line for your doctor's notes."); break;
    case "how": toast("“How we make this” lists the published guidelines behind each session and recipe (CDC STEADI, ACSM, PROT-AGE)."); break;
    case "toCheckout": {
      const cb = $("#oconsent");
      if(!cb.checked){ const er=$("#oerr"); er.hidden=false; $("#oconsent-wrap").scrollIntoView({block:"center", behavior: reduce?"auto":"smooth"}); cb.focus({preventScroll:true}); break; }
      S.offerConsent = true; S.co.consent = false; go("checkout"); break;
    }
    case "prog": { S.prog = el.dataset.p; save(); render(); break; }
    case "upyes": upsellAnswer(el.dataset.k, true); break;
    case "upno": upsellAnswer(el.dataset.k, false); break;
    case "firstSession": { S.check[0] = true; save(); toast("The follow-along video player opens here: Chang Yin counts every rep, big captions, a pause button the size of a coaster."); if(S.step==="welcome"||S.step==="dash") render(); break; }
    case "track": { S.track = el.dataset.t; save(); render(); break; }
    case "swap": { S.swap = !S.swap; save(); render(); break; }
    case "groceries": toast("Sun Yoon's printable grocery list opens here, large print, one page."); break;
    case "chat": toast("The Ask Chang Yin chat opens here, with the AI label on every message."); break;
    case "human": toast("A real person on our team replies within a day (Mon–Fri)."); break;
  }
});
document.addEventListener("change", e=>{
  const el = e.target;
  if(el.dataset && el.dataset.act==="arm"){ S.plan.arm = el.value; S.offerConsent=false; save(); render(); document.querySelector('input[name="arm"]:checked').focus(); }
  else if(el.dataset && el.dataset.act==="pack"){ S.plan.pack = el.value; S.offerConsent=false; save(); render(); document.querySelector('input[name="pack"]:checked').focus(); }
  else if(el.id==="oconsent"){ S.offerConsent = el.checked; if(el.checked) $("#oerr").hidden=true; save(); }
  else if(el.id==="cbump"){ S.co.bump = el.checked; S.co.consent = $("#cconsent").checked; S.co.name=$("#cname").value; S.co.email=$("#cemail").value; S.co.phone=$("#cphone").value; S.co.sms=$("#csms").checked; save(); const y=window.scrollY; render(); window.scrollTo(0,y); $("#cbump").focus({preventScroll:true}); }
  else if(el.id==="cconsent"){ S.co.consent = el.checked; if(el.checked) $("#cerr").hidden=true; }
  else if(el.dataset && el.dataset.act==="todo"){
    S.check[+el.dataset.i] = el.checked; save();
    const n = S.check.filter(Boolean).length; $("#todo-count").textContent = n+" of 7 done"; $("#reward").hidden = n!==7;
  }
  else if(el.id==="jump"){ go(el.value); }
});
document.addEventListener("submit", e=>{
  if(e.target.id==="coform"){ e.preventDefault(); checkoutSubmit(); }
});

buildNav();
load();
render();
})();
</script>
