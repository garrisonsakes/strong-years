# PageCreate:Createpagehowwemak
mutation PageCreateInline {
  pageCreate(page: { handle: "how-we-make-this", title: "How we make this", body: "<p>Every session, recipe and number on Strong Years starts from published research and guidelines for older adults. Each statistic carries an evidence ID that points to the study: who was studied, how many people, and how strong the evidence is. We grade evidence honestly: big reviews and guidelines first; small or observational studies are labelled as such and never presented as proof of cause and effect.</p>\n<p>Every movement is shown with a support (a counter, a chair against the wall), an easier version, and a stop rule: stop if you feel chest pain, dizziness or sharp pain. Advanced moves Chang Yin demonstrates are labelled \"Chang's level, not your starting point\".</p>\n<p>Every script passes an automated rules check and an AI review, and anything flagged goes to a person on our team before it is published.</p>\n<p>Sessions and recipes are built from published exercise and nutrition guidelines for older adults.</p>\n<p>The team: {{COMPANY_LEGAL_NAME}}, {{MAILING_ADDRESS}}.</p>", templateSuffix: "legal", isPublished: true }) {
    page { id handle }
    userErrors { field message code }
  }
}

# PageByHandle:Findpagesafety
query PageByHandleInline {
  pages(first: 1, query: "handle:safety") { nodes { id handle } }
}

# PageCreate:Createpagesafety
mutation PageCreateInline {
  pageCreate(page: { handle: "safety", title: "Safety and crisis protocol", body: "<p>The member chat (\"Ask Chang Yin\", \"Ask Sun Yoon\") is an AI. It tells you so at the start of every conversation and again at least every 3 hours of continuing conversation.</p>\n<p><strong>If you're thinking about harming yourself, call or text 988</strong> (Suicide &amp; Crisis Lifeline, free, 24/7). <strong>If you're in danger or it's a medical emergency, call 911.</strong> For concerns about an older adult's safety, the Eldercare Locator is 1-800-677-1116.</p>\n<p>Every message is checked for signs of self-harm, abuse or a medical emergency (chest pain, stroke signs, a fall with injury or a head strike). When one is found, the chat stops coaching, shows the resources above, logs the event and alerts our team. A real person on our team reads these messages 7:00 to 23:00 Eastern, 7 days a week. Outside those hours, the resources above are shown immediately and a person reads the message at 7:00 Eastern.</p>\n<p>The chat never diagnoses, never changes medication, doses or timing, and never offers therapy. Grief, relationship and mental-health conversations get the resources above and a human.</p>\n<p>If the AI service is unavailable, the chat goes offline and shows 988, 911, the Eldercare Locator and a way to reach a person.</p>", templateSuffix: "legal", isPublished: true }) {
    page { id handle }
    userErrors { field message code }
  }
}

