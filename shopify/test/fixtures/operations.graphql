# PageCreate:Createpageaboutthe
mutation PageCreateInline {
  pageCreate(page: { handle: "about-the-characters", title: "About Chang Yin and Sun Yoon", body: "<p><strong>Hi, we're AI.</strong> Chang Yin and Sun Yoon are AI characters created by a team of real people. Chang Yin is written as a 74-year-old retired welder who trains in his California garage. Sun Yoon is written as his wife, 76, who runs the kitchen and tells the truth about food. Their story is fiction, and we say so everywhere they appear: on every post, in every email, at the top of every page and at the start of every chat.</p>\n<p><strong>Why AI characters?</strong> So we can make a new session every day, at four levels, with a chair-based version of everything, without pretending anyone is something they're not.</p>\n<p><strong>Why a Chinese and Korean couple?</strong> Chang Yin draws on Chinese movement traditions such as tai chi and qigong, taught as exercise, combined with modern strength training. Sun Yoon draws on Korean home cooking: soups, fermented vegetables and banchan. We work with paid cultural reviewers from each heritage on names, food and settings. They are not monks, priests or healers, and nothing here is presented as ancient secret knowledge.</p>\n<p><strong>What's real:</strong> the exercises, the progressions, the recipes and the research behind them. Sessions and recipes are built from published exercise and nutrition guidelines for older adults. Our sources are listed on <a href=\"/pages/how-we-make-this\">How we make this</a>.</p>\n<p><strong>What they will never do:</strong> claim to be human, claim to be a doctor or therapist, show you reviews we don't have, or tell you to change your medication.</p>\n<p>General fitness and nutrition education, not medical advice. Check with your doctor before starting new exercise.</p>", templateSuffix: "characters", isPublished: true }) {
    page { id handle }
    userErrors { field message code }
  }
}

# PageByHandle:Findpagefaq
query PageByHandleInline {
  pages(first: 1, query: "handle:faq") { nodes { id handle } }
}

# PageCreate:Createpagefaq
mutation PageCreateInline {
  pageCreate(page: { handle: "faq", title: "Questions", body: "<h3>Is Chang Yin real?</h3><p>No. Chang Yin and Sun Yoon are AI characters created by our team, and their story is invented. What is real: the exercises, the progressions and the recipes, built from published exercise and nutrition guidelines for older adults.</p>\n<h3>What do I get with the Starter Books?</h3><p>Two large-print PDF books to keep: Chang Yin's 7-Day Strength Reset (seven follow-along sessions, most of them next to a chair and a counter) and Sun Yoon's Strong Kitchen. They download instantly and they never renew.</p>\n<h3>What happens after I join the membership?</h3><p>Your first month is charged today. If you do nothing, your membership continues at the same price every month on the same date, until you cancel. We email you before every renewal. Changed your mind within 14 days? You have a 14-day money-back guarantee on your membership charge, once per person.</p>\n<h3>What is the founding price?</h3><p>$25 a month, locked for as long as you stay subscribed, pauses included. Founding membership is open to the first 5,000 members or until January 9, 2027, whichever comes first. After that, new members pay $35 a month.</p>\n<h3>How do I cancel?</h3><p>Cancel online in your account at strongyears.com/account (at most two screens), or by replying \"cancel\" to any email from us. Nobody will call you, and you never need to call us to cancel.</p>\n<h3>Do I need equipment?</h3><p>No. A sturdy chair against a wall and a kitchen counter are enough. Some people add resistance loops after a few weeks.</p>\n<h3>Is this right for me?</h3><p>Strong Years is general fitness education for adults. It isn't physical therapy and doesn't replace your doctor. Check with your doctor before starting new exercise, especially with a heart condition, high blood pressure, recent surgery, a joint replacement, osteoporosis or dizziness. Every session has a chair-based version.</p>\n<h3>Can I give it to my mom or dad?</h3><p>Yes. Gift memberships are paid once (3 months for $49 or 12 months for $119) and never renew. Near the end, they can choose to continue on their own card.</p>\n<h3>Where are the reviews?</h3><p>We're new, so we won't show you reviews we don't have. Member words appear only once real members give us written permission.</p>", templateSuffix: "faq", isPublished: true }) {
    page { id handle }
    userErrors { field message code }
  }
}

# PageByHandle:Findpagehowwemaket
