# ShopPolicyUpdate:SetpolicyTERMSOFSE
mutation ShopPolicyUpdateInline {
  shopPolicyUpdate(shopPolicy: { type: TERMS_OF_SERVICE, body: "<p>Effective 2026-10-01. These terms are an agreement between you and {{COMPANY_LEGAL_NAME}} (\"we\"), {{MAILING_ADDRESS}}, for the Strong Years website at strongyears.com, the members area at https://members.strongyears.com, and everything we sell.</p>\n<h3>1. Who can use Strong Years</h3>\n<p>You must be 18 or older to buy or to create a members account.</p>\n<h3>2. What Strong Years is, and what it is not</h3>\n<p>Strong Years is general fitness and nutrition education: follow-along exercise sessions, recipes, printables and an AI coach chat. It is not medical care, physical therapy, a diagnosis or a treatment, and it does not replace your doctor or anyone who can examine you in person. Check with your doctor before starting new exercise, especially if you have a heart condition, high blood pressure, recent surgery, a joint replacement, osteoporosis or dizziness. Stop any exercise if you feel chest pain, dizziness or sharp pain. In an emergency, call 911.</p>\n<h3>3. AI characters</h3>\n<p><strong>Chang Yin and Sun Yoon are AI characters</strong> created by the Strong Years team. Their life story (the welding, the garage, the fifty years of marriage) is fiction. They are not real people, not doctors, not physical therapists, not dietitians and not religious teachers. Sessions and recipes are built from published exercise and nutrition guidelines for older adults. Everything here is general fitness and nutrition education, not medical advice. Check with your doctor before starting new exercise.</p>\n<p>The member chat is an AI. It says so at the start of every conversation and again during long conversations. It does not give medical advice, does not change medications and does not provide therapy. If you write about harming yourself, it shows crisis resources: call or text 988 (Suicide &amp; Crisis Lifeline, free, 24/7), or call 911 in an emergency. Our crisis protocol is published at <a href=\"https://strongyears.com/pages/safety\">strongyears.com/pages/safety</a>.</p>\n<h3>4. Memberships, renewals and cancellation</h3>\n<p>Memberships renew automatically until you cancel. Prices, renewal terms, cancellation, reminders and refunds are set out in our <a href=\"https://strongyears.com/pages/membership-and-cancellation\">Membership and cancellation policy</a>, which is part of these terms. You can cancel online in your account at <a href=\"https://strongyears.com/account\">strongyears.com/account</a> (at most two screens), or by replying \"cancel\" to any email from us.</p>\n<h3>5. Digital products</h3>\n<p>Books, printables and programs are licensed to you for personal, non-commercial use. Please don't resell or share the files publicly.</p>\n<h3>6. Reviews and member stories</h3>\n<p>We never write, buy or invent reviews or testimonials. We only show a member's words with their written permission.</p>\n<h3>7. Your content and community rules</h3>\n<p>Be kind in the community. We remove harassment, sales pitches and requests for money. There are no private messages between members.</p>\n<h3>8. Limits</h3>\n<p>To the extent the law allows, our total liability to you is limited to the amount you paid us in the 12 months before the claim. Nothing in these terms limits rights you have under consumer protection law that cannot be limited.</p>\n<h3>9. Changes</h3>\n<p>If we change these terms in a way that matters to you, we email you at least 30 days before the change takes effect.</p>\n<h3>10. Law and contact</h3>\n<p>These terms are governed by the laws of {{GOVERNING_STATE}} and applicable US federal law. Questions: {{SUPPORT_EMAIL}}, {{BILLING_PHONE}}, {{MAILING_ADDRESS}}.</p>" }) {
    shopPolicy { id type }
    userErrors { field message code }
  }
}

# ShopPolicyUpdate:SetpolicyPRIVACYPO
mutation ShopPolicyUpdateInline {
  shopPolicyUpdate(shopPolicy: { type: PRIVACY_POLICY, body: "<p>Effective 2026-10-01. {{COMPANY_LEGAL_NAME}} (\"we\") runs strongyears.com and https://members.strongyears.com.</p>\n<h3>What we collect</h3>\n<ul>\n<li><strong>Account and order details:</strong> name, email, billing details and order history. Payments are processed by Shopify; we never see your full card number.</li>\n<li><strong>How you found us:</strong> the link you arrived from (for example utm tags, the post or page that sent you, and the keyword you commented). We use this to know which posts help people, and to pay affiliates.</li>\n<li><strong>What you tell us in the app:</strong> your level, test scores, goals and anything you choose to tell the AI coach. Health-related details are consumer health data. We collect them only with your opt-in consent, use them only to run your plan, never sell them and never send them to advertising platforms.</li>\n<li><strong>Device and usage data</strong> such as pages viewed and sessions completed.</li>\n</ul>\n<h3>How we use it</h3>\n<p>To deliver your membership and downloads, send the emails you need (receipts, renewal reminders, the yearly summary), improve the program, prevent fraud and repeat refunds, and meet legal duties such as keeping consent records for automatic renewals.</p>\n<h3>Advertising</h3>\n<p>We may use advertising pixels to measure purchases. We send event names that don't describe health (for example \"Purchase\") and never send quiz answers, test scores or anything you tell the coach.</p>\n<h3>Who we share it with</h3>\n<p>Service providers that run the store and the members area (Shopify for checkout, our hosting and database providers, our email provider), under contracts that limit their use. We don't sell personal information.</p>\n<h3>Your choices and rights</h3>\n<p>You can see, correct, download or delete your data, see and delete what the AI coach remembers, and withdraw consent at any time in your account or by emailing {{SUPPORT_EMAIL}}. Residents of California, Washington, Nevada, Connecticut, Colorado, Virginia and other states have additional rights, which we honor for everyone.</p>\n<h3>Age</h3>\n<p>Strong Years is for adults 18 and older.</p>\n<h3>Contact</h3>\n<p>{{COMPANY_LEGAL_NAME}}, {{MAILING_ADDRESS}}, {{SUPPORT_EMAIL}}.</p>" }) {
    shopPolicy { id type }
    userErrors { field message code }
  }
}

# ShopPolicyUpdate:SetpolicySHIPPINGP
mutation ShopPolicyUpdateInline {
  shopPolicyUpdate(shopPolicy: { type: SHIPPING_POLICY, body: "<p><strong>Digital products and memberships</strong> are delivered instantly by email and in your members area. Nothing is shipped.</p>\n<p><strong>The Strong Years Kit</strong> ships to US addresses only. Orders leave our warehouse within 2 business days. You get a tracking email when it ships. Refund on request within 30 days of delivery, no return needed.</p>" }) {
    shopPolicy { id type }
    userErrors { field message code }
  }
}

# ShopPolicyUpdate:SetpolicyCONTACTIN
mutation ShopPolicyUpdateInline {
  shopPolicyUpdate(shopPolicy: { type: CONTACT_INFORMATION, body: "<p>{{COMPANY_LEGAL_NAME}}<br>{{MAILING_ADDRESS}}<br>Email: {{SUPPORT_EMAIL}}<br>Billing questions: {{BILLING_PHONE}}</p><p>A real person on our team reads messages 7:00 to 23:00 Eastern, 7 days a week.</p>" }) {
    shopPolicy { id type }
    userErrors { field message code }
  }
}

