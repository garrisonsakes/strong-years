# ProductByHandle:Checksellingplangr
query ProductByHandleInline {
  productByIdentifier(identifier: { handle: "founding-annual" }) {
    id
    handle
    status
    requiresSellingPlan
    variants(first: 10) {
      nodes { id title price sku inventoryItem { id tracked } inventoryQuantity }
    }
    sellingPlanGroups(first: 10) {
      nodes {
        id
        name
        appId
        sellingPlans(first: 10) {
          nodes {
            id
            name
            billingPolicy { ... on SellingPlanRecurringBillingPolicy { interval intervalCount } }
          }
        }
      }
    }
  }
}

# SellingPlanGroupCreate:Createsellingplang
mutation SellingPlanGroupCreateInline {
  sellingPlanGroupCreate(input: { name: "Yearly membership", merchantCode: "sy-yearly", options: ["Plan"], position: 1, sellingPlansToCreate: [{ name: "Yearly, renews until you cancel", description: "Billed every year until you cancel. We email you 30 days before each renewal.", options: ["Yearly, renews until you cancel"], position: 1, category: SUBSCRIPTION, billingPolicy: { recurring: { interval: YEAR, intervalCount: 1 } }, deliveryPolicy: { recurring: { interval: YEAR, intervalCount: 1 } }, pricingPolicies: [] }] }, resources: { productIds: ["gid://shopify/Product/DRYRUN-founding-annual"] }) {
    sellingPlanGroup { id sellingPlans(first: 10) { nodes { id name } } }
    userErrors { field message code }
  }
}

