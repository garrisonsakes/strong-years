#cloud-config
# Hetzner Cloud (Ubuntu 24.04, CCX23 or larger for the assembly worker). Create with:
#   hcloud server create --name strongyears-ops --type ccx23 --image ubuntu-24.04 --ssh-key <key> --user-data-from-file deploy/cloud-init.yaml
# Hardens the box, installs Docker, creates the deploy user. The repo and secrets are copied by a person afterwards
# (git clone over SSH + 1Password-rendered deploy/.env and deploy/secrets.env); nothing secret lives in this file.
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, gnupg, ufw, fail2ban, unattended-upgrades, git, make, python3, postgresql-client]
users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys: []          # add the operator's public key here or via --ssh-key
write_files:
  - path: /etc/ssh/sshd_config.d/90-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no
  - path: /etc/docker/daemon.json
    content: |
      {"log-driver": "json-file", "log-opts": {"max-size": "20m", "max-file": "5"}}
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update && apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - usermod -aG docker deploy
  - ufw default deny incoming && ufw default allow outgoing
  - ufw allow OpenSSH && ufw allow 80/tcp && ufw allow 443/tcp && ufw --force enable
  - systemctl enable --now fail2ban docker
  - systemctl restart ssh
  - mkdir -p /opt/strongyears && chown deploy:deploy /opt/strongyears
final_message: "Ready. As deploy: git clone the repo into /opt/strongyears, add deploy/.env + deploy/secrets.env, then make check-secrets && make db-migrate && make up"
