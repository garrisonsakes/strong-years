#cloud-config
# Hetzner Cloud (Ubuntu 24.04, CCX33: 8 dedicated vCPU / 32 GB / 240 GB, sized for 458 renders/day; deploy/README.md
# "Capacity"). Create with Hetzner Backups on (off-box copy of the disk):
#   hcloud server create --name strongyears-ops --type ccx33 --image ubuntu-24.04 --ssh-key <key> --user-data-from-file deploy/cloud-init.yaml
#   hcloud server enable-backup strongyears-ops
# Hardens the box, installs Docker, creates the deploy user. The repo and secrets are copied by a person afterwards
# (git clone over SSH + 1Password-rendered deploy/.env and deploy/secrets.env); nothing secret lives in this file.
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, gnupg, ufw, fail2ban, unattended-upgrades, git, make, python3, postgresql-client]
users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys: []          # add the operator's public key here or via --ssh-key
write_files:
  - path: /etc/ssh/sshd_config.d/90-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no
  - path: /etc/docker/daemon.json
    content: |
      {"log-driver": "json-file", "log-opts": {"max-size": "20m", "max-file": "5"}}
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/cron.d/strongyears
    content: |
      # Ops-box housekeeping (deploy/README.md "Capacity"). Logs: /var/log/strongyears-cron.log
      SHELL=/bin/bash
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      */30 * * * * deploy cd /opt/strongyears && docker compose --env-file deploy/.env -f deploy/docker-compose.yml exec -T workers python3 -m common.janitor >> /var/log/strongyears-cron.log 2>&1
      */15 * * * * deploy cd /opt/strongyears/shopify && docker run --rm --env-file ../deploy/secrets.env -e DRY_RUN=false -v "$PWD":/w -w /w node:24-alpine npm run --silent webhooks:heal >> /var/log/strongyears-cron.log 2>&1
      15 3 * * * deploy /opt/strongyears/deploy/scripts/backup.sh >> /var/log/strongyears-cron.log 2>&1
runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update && apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - usermod -aG docker deploy
  - ufw default deny incoming && ufw default allow outgoing
  - ufw allow OpenSSH && ufw allow 80/tcp && ufw allow 443/tcp && ufw --force enable
  - systemctl enable --now fail2ban docker
  - systemctl restart ssh
  - mkdir -p /opt/strongyears && chown deploy:deploy /opt/strongyears
  - touch /var/log/strongyears-cron.log && chown deploy:deploy /var/log/strongyears-cron.log
final_message: "Ready. As deploy: git clone the repo into /opt/strongyears, add deploy/.env + deploy/secrets.env, then make check-secrets && make db-migrate && make up, and once: cd shopify && docker run --rm -v $PWD:/w -w /w node:24-alpine npm ci"
